services:
  - type: web
    name: enscs-champions
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets are never stored in the repository: set them in the Render dashboard.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_BACKUP_TOKEN
        sync: false

